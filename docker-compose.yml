# One command:  docker compose up
#   API + Swagger UI:  http://localhost:18000/docs   (port busy? APP_PORT=18010 docker compose up)
#   Tests:             docker compose run --rm app pytest -q
#   Evaluation:        docker compose run --rm app python -m eval.run_retrieval
#                      docker compose run --rm app python -m eval.run_e2e   (--offline without a key)
services:
  app:
    build: .
    image: commute-policy-assistant
    ports:
      # Host port 18000 (an uncommon one, so it rarely clashes); the container listens on 8000 inside.
      - "${APP_PORT:-18000}:8000"    # port busy? run:  APP_PORT=18010 docker compose up
    # Optional: copy .env.example to .env and set GROQ_API_KEY for real answers.
    # Without it the service still starts, in offline mode (FakeLLM).
    env_file:
      - path: .env
        required: false
    volumes:
      - app-data:/app/data   # Chroma files + generated JWT secret survive restarts
    restart: unless-stopped

volumes:
  app-data:
